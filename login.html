<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VentureOut Client Portal</title>
    <meta name="description" content="Log in to your VentureOut account to view your upcoming bookings, travel itineraries, rewards points, and concierge messages.">
    <meta name="keywords" content="ventureout login, travel portal login, member sign in">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <!-- Custom CSS System -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Main Auth Form Section -->
    <main class="flex-grow-1 d-flex align-items-center py-5" style="background: linear-gradient(135deg, rgba(15, 23, 42, 0.4) 0%, rgba(13, 148, 136, 0.4) 100%), url('https://images.unsplash.com/photo-1503220317375-aaad61436b1b?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="auth-card p-4 p-md-5 shadow-lg border-0 bg-surface position-relative">

                        <!-- Theme & RTL Toggle Buttons — Top Right Corner Inside Card -->
                        <div class="auth-card-controls">
                            <button id="themeToggleBtn" class="theme-toggle-btn" type="button" title="Toggle Theme">
                                <i class="bi bi-moon-stars-fill"></i>
                            </button>
                            <button id="rtlToggleBtn" class="rtl-toggle-btn" type="button" title="Toggle RTL">
                                RTL
                            </button>
                        </div>

                        <div class="text-center mb-4">
                            <a class="navbar-brand d-inline-block mb-3 text-dark text-decoration-none" href="index.html">
                                <i class="bi bi-compass-fill text-primary-custom fs-1 align-middle"></i>
                                <span class="fs-2 fw-bold align-middle ms-1">VentureOut</span>
                            </a>
                            <h4 class="font-heading fw-bold mb-1">Welcome Back</h4>
                            <p class="text-muted small">Sign in to manage your adventure bookings</p>
                        </div>

                        <form action="index.html">
                            <div class="mb-3">
                                <label class="form-label font-sm fw-bold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" placeholder="name@domain.com" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label font-sm fw-bold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#loginPassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-input-label text-muted small" for="rememberMe">Remember me on this device</label>
                                </div>
                                <a href="#" class="small text-primary-custom">Forgot?</a>
                            </div>
                            <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3">Sign In To Dashboard</button>

                            <div class="position-relative text-center my-4 py-2">
                                <hr>
                                <span class="position-absolute top-50 start-50 translate-middle bg-surface px-3 text-muted small">OR SIGN IN WITH</span>
                            </div>

                            <!-- Social Login Buttons -->
                            <div class="d-grid gap-2 mb-4">
                                <button type="button" class="btn btn-outline-custom w-100 py-2 btn-sm"><i class="bi bi-google text-danger me-1"></i> Google</button>
                                <button type="button" class="btn btn-outline-custom w-100 py-2 btn-sm"><i class="bi bi-facebook text-primary me-1"></i> Facebook</button>
                                <button type="button" class="btn btn-outline-custom w-100 py-2 btn-sm"><i class="bi bi-apple me-1"></i> Apple</button>
                            </div>
                            <p class="text-center text-muted small mb-0">Don't have an account? <a href="signup.html" class="fw-bold text-primary-custom">Create Account</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
