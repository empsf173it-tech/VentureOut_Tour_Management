<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0d9488"/>
  <!-- Compass outer ring -->
  <circle cx="32" cy="32" r="22" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <!-- Compass needle - North (white) -->
  <polygon points="32,13 28,32 32,29 36,32" fill="#ffffff"/>
  <!-- Compass needle - South (amber) -->
  <polygon points="32,51 28,32 32,35 36,32" fill="#f59e0b"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <!-- Cardinal dots -->
  <circle cx="32" cy="11" r="2" fill="#ffffff"/>
  <circle cx="53" cy="32" r="2" fill="#ffffff"/>
  <circle cx="32" cy="53" r="2" fill="#ffffff"/>
  <circle cx="11" cy="32" r="2" fill="#ffffff"/>
</svg>
